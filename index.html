<!DOCTYPE html>
<html lang="pt-BR" class="custom-scroll">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Interativo - Navigation Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos globais e fontes */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 1.5rem;
      color: #f8fafc;
    }

    /* -------------------------------------------------------------
       SCROLLBAR COM DEGRADÊ FORÇADO:
       AMARELO -> VERMELHO -> VERDE -> AZUL
       ------------------------------------------------------------- */
    
    ::-webkit-scrollbar {
      width: 16px !important;
      height: 16px !important;
    }

    ::-webkit-scrollbar-track {
      background: #090d16 !important;
    }

    ::-webkit-scrollbar-thumb {
      background-image: linear-gradient(
        180deg, 
        #ffe600 0%,    /* Amarelo */
        #f5222d 33%,   /* Vermelho */
        #1dba52 66%,   /* Verde */
        #00a2ff 100%   /* Azul */
      ) !important;
      border-radius: 10px !important;
      border: 3px solid #090d16 !important;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5) !important;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-image: linear-gradient(
        180deg, 
        #fff04d 0%,    /* Amarelo Brilhante */
        #ff4d57 33%,   /* Vermelho Brilhante */
        #2ee86f 66%,   /* Verde Brilhante */
        #33b5ff 100%   /* Azul Brilhante */
      ) !important;
    }

    /* -------------------------------------------------------------
       ESTILOS DA GRADE E CARTÕES
       ------------------------------------------------------------- */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      padding: 1rem;
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .color-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 1.25rem;
      text-decoration: none;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease;
      outline: none;
      overflow: hidden;
    }

    .color-card:hover,
    .color-card:focus-visible {
      opacity: 1.0;
      transform: scale(1.03);
      z-index: 10;
    }

    .card-blue {
      background-color: #00a2ff;
      box-shadow: 0 10px 30px -5px rgba(0, 162, 255, 0.4);
    }

    .card-green {
      background-color: #1dba52;
      box-shadow: 0 10px 30px -5px rgba(29, 186, 82, 0.4);
    }

    .card-yellow {
      background-color: #ffe600;
      box-shadow: 0 10px 30px -5px rgba(255, 230, 0, 0.4);
      color: #1e293b;
    }

    .card-red {
      background-color: #f5222d;
      box-shadow: 0 10px 30px -5px rgba(245, 34, 45, 0.4);
    }

    .card-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .color-card:hover .card-icon-wrapper {
      transform: translateY(-4px);
    }

    .card-title {
      margin-top: 0.75rem;
      font-weight: 800;
      font-size: 1.125rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .color-card:hover .card-title {
      opacity: 1;
      transform: translateY(0);
    }

    #navigation-modal {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body>

  <header class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
      Meus Currículos
    </h1>
    <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto">
      <i>Segue abaixo o resumo dos meus aprendizados.</i>
    </p>
  </header>

  <main class="grid-container" id="hub-grid">
    
    <!-- 1. Azul: Redes -->
    <a href="Redes.html" class="color-card card-blue" data-title="Redes" data-target="formação na área de Redes">
      <div class="card-icon-wrapper">
        <svg class="w-20 h-20 text-white stroke-current drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="11" rx="2"></rect>
          <path d="M12 14v3"></path>
          <path d="M8 21h8"></path>
          <circle cx="7" cy="8.5" r="1" fill="currentColor"></circle>
          <circle cx="12" cy="6.5" r="1" fill="currentColor"></circle>
          <circle cx="17" cy="8.5" r="1" fill="currentColor"></circle>
          <path d="M7 8.5L12 6.5L17 8.5"></path>
        </svg>
      </div>
      <span class="card-title text-white">REDES</span>
    </a>

    <!-- 2. Verde: Programação -->
    <a href="WEB.html" class="color-card card-green" data-title="Programação" data-target="Meus conhecimentos na área da programação">
      <div class="card-icon-wrapper">
        <svg class="w-20 h-20 text-white stroke-current drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <span class="card-title text-white">Programação</span>
    </a>

    <!-- 3. Amarelo: Arte Gráficas -->
    <a href="artes.html" class="color-card card-yellow" data-title="Arte gráficas" data-target="Meus conhecimentos em Arte Gráficas">
      <div class="card-icon-wrapper">
        <svg class="w-20 h-20 text-white stroke-current drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path>
          <path d="M12 21a3 3 0 0 0 3-3c0-.8-.3-1.5-.8-2-.5-.5-.7-1.2-.7-2 0-1.7 1.3-3 3-3h1.5a3 3 0 0 0 3-3 9 9 0 0 0-9-9"></path>
          <circle cx="7.5" cy="10.5" r="1" fill="#ffffff"></circle>
          <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
          <circle cx="16.5" cy="10.5" r="1" fill="#ffffff"></circle>
        </svg>
      </div>
      <span class="card-title text-slate-900">Arte Gráficas</span>
    </a>

    <!-- 4. Vermelho: Mais sobre mim -->
    <a href="medio.html" class="color-card card-red" data-title="Mais sobre mim!" data-target="Mais sobre mim!">
      <div class="card-icon-wrapper">
        <svg class="w-20 h-20 text-slate-900 fill-current drop-shadow-sm" viewBox="0 0 24 24">
          <rect x="10.2" y="1.5" width="3.6" height="3" rx="0.5" fill="currentColor"/>
          <circle cx="9.3" cy="2.5" r="0.6" fill="#ffe600"/>
          <circle cx="14.7" cy="2.5" r="0.6" fill="#ffe600"/>
          <circle cx="9.3" cy="3.8" r="0.6" fill="#ffe600"/>
          <circle cx="14.7" cy="3.8" r="0.6" fill="#ffe600"/>
          <rect x="11.1" y="4.5" width="1.8" height="6.5" fill="#ffffff"/>
          <path d="M 12 10.8 C 9.2 10.8, 7.8 12.2, 7.8 14.2 C 7.8 15.6, 8.8 16.4, 9.6 16.9 C 8.0 17.7, 6.2 19.1, 6.2 21.3 C 6.2 23.2, 8.8 24.2, 12 24.2 C 15.2 24.2, 17.8 23.2, 17.8 21.3 C 17.8 19.1, 16.0 17.7, 14.4 16.9 C 15.2 16.4, 16.2 15.6, 16.2 14.2 C 16.2 12.2, 14.8 10.8, 12 10.8 Z" fill="currentColor"/>
          <circle cx="12" cy="14.5" r="1.3" fill="#ffe600"/>
          <circle cx="12" cy="14.5" r="0.9" fill="currentColor"/>
          <rect x="10" y="20.5" width="4" height="0.9" rx="0.3" fill="#ffe600"/>
        </svg>
      </div>
      <span class="card-title text-white">Mais sobre mim</span>
    </a>

  </main>

  <!-- Modal de Navegação -->
  <div id="navigation-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-all">
      <div id="modal-icon-container" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4"></div>
      <h3 id="modal-title" class="text-xl font-bold text-white mb-2">Navegando...</h3>
      <p id="modal-desc" class="text-slate-400 text-sm mb-6">Redirecionando para a página correspondente...</p>
      <div class="flex gap-3 justify-center">
        <button id="close-modal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-semibold transition-colors">
          Cancelar
        </button>
        <button id="confirm-modal" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition-colors">
          Acessar Página
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.color-card');
      const modal = document.getElementById('navigation-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalDesc = document.getElementById('modal-desc');
      const modalIconContainer = document.getElementById('modal-icon-container');
      const closeModalBtn = document.getElementById('close-modal');
      const confirmModalBtn = document.getElementById('confirm-modal');

      let currentTargetUrl = '';

      cards.forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          
          const title = card.getAttribute('data-title');
          const targetText = card.getAttribute('data-target');
          currentTargetUrl = card.getAttribute('href'); 
          
          const bgClass = card.classList.contains('card-blue') ? 'bg-sky-500' :
                          card.classList.contains('card-green') ? 'bg-emerald-500' :
                          card.classList.contains('card-yellow') ? 'bg-amber-400' : 'bg-red-500';

          modalTitle.textContent = title;
          modalDesc.textContent = `Você está sendo redirecionado para "${targetText}".`;
          modalIconContainer.className = `w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${bgClass}`;
          
          const cardIcon = card.querySelector('.card-icon-wrapper').innerHTML;
          modalIconContainer.innerHTML = cardIcon;

          modal.classList.remove('opacity-0', 'pointer-events-none');
        });
      });

      closeModalBtn.addEventListener('click', () => {
        modal.classList.add('opacity-0', 'pointer-events-none');
      });

      // ALTIMAÇÃO AQUI: Abre a página numa nova aba e fecha o modal no index
      confirmModalBtn.addEventListener('click', () => {
        if (currentTargetUrl) {
          window.open(currentTargetUrl, '_blank'); // Abre em uma nova aba
          modal.classList.add('opacity-0', 'pointer-events-none'); // Esconde o modal na aba atual
        }
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.add('opacity-0', 'pointer-events-none');
        }
      });
    });
  </script>
</body>
</html>
